__include__: [
  'ecdet.yml',
]

output_dir: outputs/ecdet_s_visdrone_tiled

# Backbone ECDet-S
ViTAdapter:
  name: ecvitt
  embed_dim: 192
  num_heads: 3
  interaction_indexes: [10, 11]
  weights_path: ecvits/ecvitt.pth

# Tiling parameters injected into ECDet -> ViTAdapter
ECDet:
  tile_size: 448
  tile_stride: 224

# Encoder and decoder — same architecture, tuned dims
HybridEncoder:
  in_channels: [192, 192, 192]
  depth_mult: 0.67
  expansion: 0.34
  hidden_dim: 192
  dim_feedforward: 512

ECTransformer:
  feat_channels: [192, 192, 192]
  hidden_dim: 192
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1
  # eval_spatial_size deliberately unset — forces dynamic anchor generation
  # for variable-size feature maps from tiled input

# VisDrone 2019 DET: 10 classes
# (pedestrian, people, bicycle, car, van, truck, tricycle, awning-tricycle, bus, motor)
num_classes: 10

# Dataset paths — update these for your environment
train_dataloader:
  dataset:
    img_folder: data/VisDrone2019-DET-train/images
    ann_file: data/VisDrone2019-DET-train/annotations/train.json
    transforms:
      ops:
        # No Mosaic, RandomZoomOut, RandomIoUCrop — incompatible with variable sizes
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomHorizontalFlip}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        # PadToMultiple MUST come after ConvertPILImage (operates on tensors)
        - {type: PadToMultiple, tile_size: 448, stride: 224}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy: default

  collate_fn:
    type: BatchImageCollateFunction
    mixup_prob: 0.0
    mixup_epoch: 0

  shuffle: True
  total_batch_size: 4
  num_workers: 4

val_dataloader:
  dataset:
    img_folder: data/VisDrone2019-DET-val/images
    ann_file: data/VisDrone2019-DET-val/annotations/val.json
    transforms:
      ops:
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: PadToMultiple, tile_size: 448, stride: 224}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
  shuffle: False
  total_batch_size: 2
  num_workers: 4

# Training schedule — Phase 1 only (backbone frozen)
# Phase 2 (unfreeze backbone with low LR) requires a separate config or
# manual LR adjustment after epoch 20
epochs: 50
warmup_iter: 500
lr_gamma: 0.5

optimizer:
  type: AdamW
  params:
    -
      # Backbone weights (non-norm) — frozen Phase 1, low LR Phase 2
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias|tile_pos_proj)).*$'
      lr: 0.0
    -
      # Backbone norm/bn/bias — frozen Phase 1
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0
      weight_decay: 0.
    -
      # tile_pos_proj — new params, train from start
      params: 'tile_pos_proj'
      lr: 0.0002
    -
      # Everything else (encoder, decoder) norm/bn/bias
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

use_amp: True
use_ema: True

# Disable eval_spatial_size to force dynamic anchors
eval_spatial_size: ~

clip_max_norm: 0.1
