__include__: [
  '../dataset/visdrone_detection.yml',
  'ecdet.yml',
]

output_dir: outputs/ecdet_s_visdrone_tiled

# Backbone ECDet-S
ViTAdapter:
  name: ecvitt
  embed_dim: 192
  num_heads: 3
  interaction_indexes: [10, 11]
  weights_path: ecvits/ecvitt.pth

# Tiling parameters injected into ECDet -> ViTAdapter
ECDet:
  tile_size: 448
  tile_stride: 224

# Encoder and decoder — same architecture, tuned dims
HybridEncoder:
  in_channels: [192, 192, 192]
  depth_mult: 0.67
  expansion: 0.34
  hidden_dim: 192
  dim_feedforward: 512

ECTransformer:
  feat_channels: [192, 192, 192]
  hidden_dim: 192
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1

# Dynamic anchors are always used during training regardless of this value.
# Set to [640,640] to satisfy reset_cfg() config parsing.
# For tiled eval, override to None or pass actual padded size.
eval_spatial_size: [640, 640]

train_dataloader:
  dataset:
    transforms:
      ops:
        # No Mosaic, RandomZoomOut, RandomIoUCrop — incompatible with variable sizes
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomHorizontalFlip}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        # Resize to uniform tile-compatible size (all VisDrone frames are 9:16)
        # 896x1344 → 3x5=15 tiles. For full 1080p use [1120, 2016] → 4x8=32 tiles.
        - {type: Resize, size: [896, 1344]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        # PadToMultiple MUST come after ConvertPILImage (operates on tensors)
        - {type: PadToMultiple, tile_size: 448, stride: 224}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy: stop_epoch
      stop_epoch: 48

  collate_fn:
    mixup_prob: 0.0
    mixup_epoch: 0

  total_batch_size: 4

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [896, 1344]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: PadToMultiple, tile_size: 448, stride: 224}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  total_batch_size: 2

# Training schedule — Phase 1 only (backbone frozen)
# Phase 2 (unfreeze backbone with low LR) requires a separate config or
# manual LR adjustment after epoch 20
epochs: 50
warmup_iter: 500
lr_gamma: 0.5

optimizer:
  type: AdamW
  params:
    -
      # Backbone weights (non-norm) — frozen Phase 1, low LR Phase 2
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias|tile_pos_proj)).*$'
      lr: 0.0
    -
      # Backbone norm/bn/bias — frozen Phase 1
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0
      weight_decay: 0.
    -
      # tile_pos_proj — new params, train from start
      params: 'tile_pos_proj'
      lr: 0.0002
    -
      # Everything else (encoder, decoder, projector) norm/bn/bias
      params: '^(?!.*\.backbone)(?!.*tile_pos_proj)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

use_amp: True
use_ema: True

clip_max_norm: 0.1
