task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]
  verbose: False

num_classes: 10
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /mnt/f/dataset_uav/visdrone_coco/train/images
    ann_file: /mnt/f/dataset_uav/visdrone_coco/train/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /mnt/f/dataset_uav/visdrone_coco/val/images
    ann_file: /mnt/f/dataset_uav/visdrone_coco/val/annotations/val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
